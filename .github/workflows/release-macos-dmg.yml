name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos-dmg:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD}" ] || [ -z "${MACOS_KEYCHAIN_PASSWORD}" ]; then
            echo "Missing one or more macOS signing secrets." >&2
            exit 1
          fi

          CERT_PATH="${RUNNER_TEMP}/developer_id_application.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/release.keychain-db"
          CERT_PATH="${CERT_PATH}" CERT_B64="${MACOS_CERTIFICATE_P12_BASE64}" python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["CERT_B64"]))'

          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" ${EXISTING_KEYCHAINS}

      - name: Write notarization API key
        env:
          APPLE_NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_PRIVATE_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_NOTARY_API_PRIVATE_KEY_BASE64}" ] || [ -z "${APPLE_NOTARY_KEY_ID}" ]; then
            echo "Missing notarization API key secrets." >&2
            exit 1
          fi

          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          KEY_PATH="${KEY_PATH}" KEY_B64="${APPLE_NOTARY_API_PRIVATE_KEY_BASE64}" python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["KEY_PATH"]).write_bytes(base64.b64decode(os.environ["KEY_B64"]))'
          chmod 600 "${KEY_PATH}"
          echo "APPLE_NOTARY_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Build, sign, and notarize DMG
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./PruneApp/scripts/release-dmg.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pruneapp-macos-dmg
          path: build/release/dmg/out/*

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" build/release/dmg/out/* --clobber
          else
            gh release create "${TAG_NAME}" build/release/dmg/out/* --title "${TAG_NAME}" --generate-notes
          fi
