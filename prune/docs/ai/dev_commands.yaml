version: 1
commands:
  - name: tests
    command: cargo test
    description: Run workspace unit tests.
  - name: coverage
    command: ./scripts/codex/coverage.sh
    description: Generate an llvm-cov summary for the workspace (requires cargo-llvm-cov).
  - name: surreal-tests
    command: cargo test -p ce-store-surreal --features surreal
    description: Run Surreal store tests (mem engine).
  - name: surreal-build-ce-cli
    command: cargo build -p ce-cli --features surreal
    description: Build ce-cli with Surreal backend enabled.
  - name: surreal-build-ce-mcp
    command: cargo build -p ce-mcp --features surreal
    description: Build ce-mcp with Surreal backend enabled.
  - name: surreal-bench-index
    command: cargo run -p ce-cli --features surreal -- bench --repo . --store surreal --workload index
    description: Run the Surreal index benchmark for the current repo.
  - name: surreal-pack
    command: cargo run -p ce-cli --features surreal -- pack --store surreal --surreal-path .ce/surreal --task "Describe change"
    description: Build a Surreal-backed context pack (repo-root path discovery).
  - name: a2ui-tests
    command: cd A2UIRuntime && swift test
    description: Run A2UIRuntime Swift package tests.
  - name: docs-doctor
    command: cargo run -p ce-cli -- docs doctor --repo .
    description: Validate external docs provider configuration.
  - name: docs-fetch
    command: cargo run -p ce-cli -- docs fetch --repo . --library supabase --query "auth"
    description: Fetch Context7 docs for a library/query pair.
  - name: memory-tests
    command: cargo test -p ce-memory
    description: Run Prune memory unit tests.
  - name: cortex-install
    command: cargo run -p ce-cli -- vendor install cortex
    description: Vendor and build the Cortex MCP server under .prune/vendors/cortex.
  - name: cortex-update
    command: cargo run -p ce-cli -- vendor update cortex
    description: Update the vendored Cortex checkout and rebuild the MCP server.
  - name: cortex-doctor
    command: cargo run -p ce-cli -- vendor doctor cortex
    description: Validate Node version and Cortex MCP tools/list readiness.
  - name: integrate-codex-cortex
    command: cargo run -p ce-cli -- integrate --repo . --agent codex --with cortex
    description: Configure Codex project MCP servers (prune + cortex).
  - name: integrate-opencode-cortex
    command: cargo run -p ce-cli -- integrate --repo . --agent opencode --with cortex
    description: Configure OpenCode MCP servers (prune + cortex).
