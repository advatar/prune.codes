version: 1
services:
  - name: ce-cli
    owner: context-engine
    type: cli
    description: Index/search/pack CLI for Prune repositories.
    ports: []
    health: none
    dependencies:
      - sqlite index (path: .ce/index.sqlite)
      - hnsw dump (path: .ce/hnsw)
      - embedded surrealdb (engine: surrealkv or mem; path: .ce/surreal)
      - optional external docs (Context7 API; cache at .ce/docs-cache/context7)
  - name: ce-mcp
    owner: context-engine
    type: stdio-server
    description: JSON-RPC MCP server used by agents.
    ports: []
    health: none
    dependencies:
      - ce-cli index artifacts (sqlite + hnsw) or embedded surrealdb store
  - name: cortex-mcp (vendored)
    owner: external
    type: stdio-server
    description: Optional external memory MCP server vendored under .prune/vendors/cortex.
    ports: []
    health: none
    dependencies:
      - node >= 18
      - vendored cortex repo (path: .prune/vendors/cortex)
      - mcp build output (path: .prune/vendors/cortex/dist/mcp-server.js)
      - cortex db (path: ~/.cortex/memory.db)
  - name: ce-memory
    owner: context-engine
    type: library
    description: Persistent project memory store (SQLite + embeddings) surfaced via CLI/MCP.
    ports: []
    health: none
    dependencies:
      - memory db (path: .prune/memory.db or ~/.prune/memory.db)
      - fastembed cache (model weights for embeddings)
