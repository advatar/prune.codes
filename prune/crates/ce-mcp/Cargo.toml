[package]
name = "ce-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "ce-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ce-core = { path = "../ce-core" }
ce-store = { path = "../ce-store" }
ce-lang-rust = { path = "../ce-lang-rust" }

bytemuck = { version = "1", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
