[package]
name = "ce-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "ce"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
serde_json = "1"
toml = "0.8"

ce-core = { path = "../ce-core" }
ce-lang-rust = { path = "../ce-lang-rust" }
ce-lang-tsreact = { path = "../ce-lang-tsreact" }
ce-lang-swift = { path = "../ce-lang-swift" }

ce-store = { path = "../ce-store" }

bytemuck = { version = "1", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
