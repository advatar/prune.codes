[package]
name = "ce-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
lsp-types = "0.97"
globset = "0.4"
which = "4"
url = "2"

[features]
default = []
