[package]
name = "ce-store-surreal"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
surreal = ["surrealdb"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

ce-store-core = { path = "../ce-store-core" }
ce-core = { path = "../ce-core" }

surrealdb = { version = "2", default-features = false, features = ["kv-mem", "kv-surrealkv"], optional = true }
